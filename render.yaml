# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: project-management-system
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
